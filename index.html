
<!DOCTYPE html>
<html lang="hr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101d43">
<title>Jakovljeva R-avantura</title>
<style>
*{box-sizing:border-box}
:root{
 --gold:#ffda63;
 --cyan:#60e4f5;
 --pink:#ff88b8;
 --green:#5ce6a4;
}
body{
 margin:0;
 min-height:100dvh;
 background:linear-gradient(160deg,#101d43,#47318a);
 color:white;
 font-family:system-ui,-apple-system,sans-serif;
}
button{
 font-family:inherit;
 cursor:pointer;
 touch-action:manipulation;
}
button:disabled{opacity:.55;cursor:default}
.app{
 max-width:560px;
 margin:auto;
 padding:14px 14px 35px;
}
header{text-align:center;padding:8px}
h1{font-size:28px;margin:5px}
.sub{font-size:14px;color:#dcd7ff}
.panel{
 background:#ffffff15;
 border:1px solid #ffffff35;
 border-radius:23px;
 padding:16px;
 margin-bottom:13px;
}
.days{
 display:grid;
 grid-template-columns:repeat(7,1fr);
 gap:5px;
}
.day{
 background:#ffffff20;
 border:1px solid #ffffff40;
 color:white;
 border-radius:12px;
 min-height:46px;
 font-weight:800;
}
.day.active{background:var(--gold);color:#202044}
.day.done{border:2px solid var(--green)}
.hero{text-align:center;font-size:70px;margin:12px}
h2{text-align:center;font-size:23px}
.help{
 text-align:center;
 color:#e8e2ff;
 line-height:1.45;
 font-size:15px;
}
.primary{
 width:100%;
 min-height:60px;
 background:var(--gold);
 border:0;
 border-radius:17px;
 color:#292044;
 font-size:19px;
 font-weight:900;
 padding:12px;
}
.listen{
 width:100%;
 min-height:95px;
 background:var(--cyan);
 color:#073c53;
 border:0;
 border-radius:20px;
 font-size:27px;
 font-weight:900;
 margin:10px 0;
}
.mic{
 width:100%;
 min-height:85px;
 background:var(--pink);
 color:#4b1640;
 border:0;
 border-radius:20px;
 font-size:24px;
 font-weight:900;
 margin:8px 0;
}
.small{display:block;font-size:13px;margin-top:4px}
.options{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:12px;
 margin:14px 0;
}
.option{
 min-height:105px;
 border-radius:20px;
 background:#ffffff20;
 border:2px solid #ffffff50;
 color:white;
 font-size:64px;
 font-weight:900;
}
.option.correct{background:#20865c}
.option.wrong{background:#963c62}
.prompt{
 font-size:24px;
 text-align:center;
 font-weight:900;
 margin:12px 0;
}
.top{
 display:flex;
 justify-content:space-between;
 align-items:center;
 margin-bottom:10px;
}
.timer{font-size:24px;font-weight:900}
.progress{
 height:12px;
 background:#ffffff30;
 border-radius:20px;
 overflow:hidden;
}
.bar{
 height:100%;
 width:0;
 background:var(--gold);
 transition:.4s;
}
.world{
 position:relative;
 height:230px;
 margin:15px 0;
 overflow:hidden;
 border-radius:22px;
 background:linear-gradient(#3471bf,#83c5ed);
}
.world.space{
 background:radial-gradient(circle at 70% 20%,#4544a0,#09152e);
}
.world.ocean{
 background:linear-gradient(#45b9d6,#075184);
}
.world.roadworld{
 background:linear-gradient(#78c5eb 0 60%,#47764d 60%);
}
.world.forest{
 background:linear-gradient(#79c9ee,#60aa77);
}
.world:before{
 content:"✦  ✧  ✦";
 position:absolute;
 top:15px;
 right:20px;
 font-size:24px;
 opacity:.6;
}
.path{
 position:absolute;
 left:8%;
 right:8%;
 bottom:50px;
 height:9px;
 background:#ffffff80;
 border-radius:20px;
}
.actor{
 position:absolute;
 left:7%;
 bottom:65px;
 font-size:66px;
 transition:left .65s ease;
 z-index:2;
 filter:drop-shadow(0 5px 5px #0004);
}
.goal{
 position:absolute;
 right:4%;
 bottom:65px;
 font-size:55px;
}
.worldLabel{
 position:absolute;
 top:12px;
 left:15px;
 font-size:14px;
 font-weight:800;
 background:#0004;
 border-radius:12px;
 padding:7px 11px;
}
.stepText{
 position:absolute;
 bottom:10px;
 left:0;
 width:100%;
 text-align:center;
 font-size:15px;
 font-weight:800;
}
.feedback{
 text-align:center;
 min-height:45px;
 font-size:19px;
 font-weight:800;
 margin:12px 0;
}
.parent{
 background:#ffffff12;
 border-radius:16px;
 padding:10px;
 margin:12px 0;
}
.parentTitle{
 font-size:12px;
 color:#d8d0ff;
 text-align:center;
 margin-bottom:8px;
}
.parent button{
 width:100%;
 background:#ffffff25;
 border:1px solid #ffffff50;
 color:white;
 padding:13px;
 border-radius:13px;
 font-size:16px;
 font-weight:800;
}
.next{
 width:100%;
 background:#ffffff25;
 border:1px solid #ffffff50;
 color:white;
 border-radius:15px;
 padding:15px;
 font-size:17px;
 font-weight:800;
}
.stars{text-align:center;font-size:36px}
.hidden{display:none!important}
.footer{
 text-align:center;
 font-size:12px;
 color:#c8c0e8;
 margin-top:15px;
}
@keyframes celebrate{
 0%,100%{transform:scale(1)}
 50%{transform:scale(1.22) rotate(-7deg)}
}
.celebrate{animation:celebrate .5s}
</style>
</head>
<body>
<div class="app">

<header>
<h1>🚀 Jakovljeva R-avantura</h1>
<div class="sub">Govori • Igraj • Osvoji cilj!</div>
</header>

<div class="panel">
<div id="days" class="days"></div>
</div>

<section id="home" class="panel">
<div id="homeEmoji" class="hero">🚀</div>
<h2 id="homeTitle"></h2>
<p id="homeDesc" class="help"></p>
<div id="homeStars" class="stars"></div>
<p class="help">Jakove, spreman za novu misiju?</p>
<button class="primary" onclick="startGame()">
▶ ZAPOČNI MISIJU
</button>
</section>

<section id="game" class="panel hidden">
<div class="top">
<strong id="mission"></strong>
<div class="timer" id="timer">05:00</div>
</div>
<div class="progress"><div id="bar" class="bar"></div></div>

<div id="world" class="world">
<div id="worldLabel" class="worldLabel"></div>
<div class="path"></div>
<div id="actor" class="actor">🚀</div>
<div id="goal" class="goal">🌕</div>
<div id="stepText" class="stepText"></div>
</div>

<div id="prompt" class="prompt"></div>
<p id="help" class="help"></p>

<button id="listenBtn" class="listen" onclick="listen()">
🔊 SLUŠAJ
<span class="small">Čuj riječ ili slog</span>
</button>

<div id="options" class="options"></div>

<button id="micBtn" class="mic" onclick="recordSpeech()">
🎤 IZGOVORI
<span class="small">Jakove, sada si ti na redu!</span>
</button>

<div id="feedback" class="feedback"></div>

<div class="parent">
<div class="parentTitle">RODITELJSKA POTVRDA</div>
<button onclick="parentConfirm()">
👏 Potvrdi Jakovljev pokušaj
</button>
</div>

<button class="next" onclick="nextTask()">
SLJEDEĆI IZAZOV ➜
</button>
</section>

<section id="finish" class="panel hidden">
<div class="hero">🏆</div>
<h2>Misija završena!</h2>
<p class="help">Jakove, stigao si do cilja!</p>
<div class="stars">⭐⭐⭐</div>
<button class="primary" onclick="finishHome()">
NASTAVI AVANTURU
</button>
</section>

<div class="footer">
Igra uz roditelja • Mikrofon ne procjenjuje pravilnost glasa R
</div>
</div>

<script>
const $=id=>document.getElementById(id);

const praise=[
"Bravo, Jakove! Ideš prema cilju!",
"Odlično, Jakove! Samo tako!",
"Svaka čast, Jakove! Pravi si junak!",
"Fenomenalno, Jakove! Još malo!",
"Super pokušaj, Jakove!",
"Jakove, osvojio si novu zvjezdicu!",
"Bravo, Jakove! Uspio si pomaknuti svog junaka!"
];

const days=[
{
title:"Svemirska misija",
emoji:"🚀",
desc:"Izgovaraj slogove i poleti do Mjeseca!",
actor:"🚀",goal:"🌕",world:"space"
},
{
title:"Utrka automobila",
emoji:"🏎️",
desc:"Svaki slog pomiče automobil prema cilju.",
actor:"🏎️",goal:"🏁",world:"roadworld"
},
{
title:"Putovanje vlakom",
emoji:"🚂",
desc:"Pokreni vlak govornim zadacima.",
actor:"🚂",goal:"🏰",world:"forest"
},
{
title:"Potraga za blagom",
emoji:"🤿",
desc:"Zaroni i pronađi skriveno blago.",
actor:"🤿",goal:"💎",world:"ocean"
},
{
title:"Šumska avantura",
emoji:"🦊",
desc:"Pronađi put kroz čarobnu šumu.",
actor:"🦊",goal:"🏡",world:"forest"
},
{
title:"Velika utrka",
emoji:"🏎️",
desc:"Pobijedi u utrci izgovaranjem slogova.",
actor:"🏎️",goal:"🏆",world:"roadworld"
},
{
title:"Završna misija",
emoji:"🚀",
desc:"Pokaži sve što si naučio!",
actor:"🚀",goal:"🏆",world:"space"
}
];

const syllables=[
"DA","DE","DI","DO","DU",
"TA","TE","TI","TO","TU",
"LA","LE","LI","LO","LU",
"RA","RE","RI","RO","RU"
];

const words=[
{word:"LAV",sound:"L"},
{word:"RIBA",sound:"R"},
{word:"LIMUN",sound:"L"},
{word:"RAK",sound:"R"},
{word:"LOPTA",sound:"L"},
{word:"ROBOT",sound:"R"},
{word:"LIST",sound:"L"},
{word:"RUKA",sound:"R"},
{word:"LUK",sound:"L"},
{word:"RUŽA",sound:"R"}
];

let day=Number(localStorage.getItem("jakov_game_day")||0);
let done=JSON.parse(localStorage.getItem("jakov_game_done")||"[]");
let task=0;
let progress=0;
let seconds=300;
let ticker=null;
let recognition=null;
let listening=false;
let current=null;
let taskCompleted=false;
let speechToken=0;

function say(text){
if(!("speechSynthesis" in window))return;
speechSynthesis.cancel();
const u=new SpeechSynthesisUtterance(text);
u.lang="hr-HR";
u.rate=.82;
speechSynthesis.speak(u);
}

function randomPraise(){
const p=praise[Math.floor(Math.random()*praise.length)];
$("feedback").textContent=p;
say(p);
}

function drawDays(){
$("days").innerHTML="";
days.forEach((d,i)=>{
const b=document.createElement("button");
b.className="day"+(day===i?" active":"")+
(done.includes(i)?" done":"");
b.textContent=(done.includes(i)?"⭐":"")+(i+1);
b.onclick=()=>{
day=i;
localStorage.setItem("jakov_game_day",day);
home();
};
$("days").appendChild(b);
});
}

function home(){
clearInterval(ticker);
stopRecognition();
$("home").classList.remove("hidden");
$("game").classList.add("hidden");
$("finish").classList.add("hidden");
$("homeEmoji").textContent=days[day].emoji;
$("homeTitle").textContent=
"Dan "+(day+1)+": "+days[day].title;
$("homeDesc").textContent=days[day].desc;
$("homeStars").textContent=
done.includes(day)?"⭐⭐⭐":"☆☆☆";
drawDays();
}

function startGame(){
task=0;
progress=0;
seconds=300;
$("timer").textContent="05:00";
$("home").classList.add("hidden");
$("finish").classList.add("hidden");
$("game").classList.remove("hidden");
clearInterval(ticker);
ticker=setInterval(()=>{
seconds--;
$("timer").textContent=
String(Math.floor(Math.max(seconds,0)/60)).padStart(2,"0")+
":"+
String(Math.max(seconds,0)%60).padStart(2,"0");
if(seconds<=0)endGame();
},1000);
showTask();
}

function taskType(){
if(task%4===0)return"listen";
if(task%4===1)return"syllable";
if(task%4===2)return"sequence";
return"word";
}

function getTask(){
const type=taskType();
if(type==="listen"||type==="word"){
return{
type,
...words[(task+day*3)%words.length]
};
}
if(type==="syllable"){
return{
type,
word:syllables[(task+day*2)%syllables.length]
};
}
const sequences=[
"DA DA DA",
"DE DE DE",
"TA DA",
"TE DE",
"DI DI DI",
"LA LA LA",
"RA RA RA"
];
return{
type,
word:sequences[(task+day)%sequences.length]
};
}

function showTask(){
taskCompleted=false;
current=getTask();
$("feedback").textContent="";
$("options").innerHTML="";
$("bar").style.width=(progress/8*100)+"%";
$("mission").textContent=
"Dan "+(day+1)+" • Izazov "+(task+1)+"/8";

const d=days[day];
$("world").className="world "+d.world;
$("worldLabel").textContent=d.title;
$("actor").textContent=d.actor;
$("goal").textContent=d.goal;
updateActor();

$("listenBtn").classList.remove("hidden");
$("micBtn").classList.remove("hidden");

if(current.type==="listen"){
$("prompt").textContent="Čuješ li L ili R?";
$("help").textContent=
"Poslušaj riječ i dodirni odgovarajuće slovo.";
$("micBtn").classList.add("hidden");
makeLetterOptions();
}
if(current.type==="syllable"){
$("prompt").textContent=current.word;
$("help").textContent=
"Poslušaj slog, izgovori ga i pomakni junaka!";
}
if(current.type==="sequence"){
$("prompt").textContent=current.word;
$("help").textContent=
"Ponovi niz slogova kao pravi govorni majstor!";
}
if(current.type==="word"){
$("prompt").textContent=current.word;
$("help").textContent=
"Poslušaj riječ i pokušaj je izgovoriti.";
}
}

function makeLetterOptions(){
["L","R"].forEach(letter=>{
const b=document.createElement("button");
b.className="option";
b.textContent=letter;
b.onclick=()=>{
if(taskCompleted)return;
if(letter===current.sound){
b.classList.add("correct");
completeTask();
}else{
b.classList.add("wrong");
$("feedback").textContent=
"Poslušaj još jednom, Jakove!";
say("Poslušaj još jednom, Jakove!");
}
};
$("options").appendChild(b);
});
}

function listen(){
if(!current)return;
say(current.word.toLowerCase());
}

function updateActor(){
const pct=Math.min(progress/8,1);
$("actor").style.left=(7+pct*65)+"%";
$("stepText").textContent=
"Prijeđeno "+progress+" od 8 koraka";
}

function completeTask(){
if(taskCompleted)return;
taskCompleted=true;
progress=Math.min(progress+1,8);
updateActor();
$("bar").style.width=(progress/8*100)+"%";
$("actor").classList.remove("celebrate");
void $("actor").offsetWidth;
$("actor").classList.add("celebrate");
randomPraise();
if(progress>=8){
setTimeout(endGame,1800);
}
}

function parentConfirm(){
completeTask();
}

function stopRecognition(){
if(recognition){
try{recognition.abort()}catch(e){}
recognition=null;
}
listening=false;
$("micBtn").disabled=false;
}

function recordSpeech(){
if(listening||taskCompleted)return;
const SR=window.SpeechRecognition||
window.webkitSpeechRecognition;

if(!SR){
$("feedback").textContent=
"Prepoznavanje govora nije dostupno. Roditelj može potvrditi pokušaj.";
return;
}

speechSynthesis.cancel();
stopRecognition();
const token=++speechToken;
const rec=new SR();
recognition=rec;
rec.lang="hr-HR";
rec.interimResults=false;
rec.maxAlternatives=1;
rec.continuous=false;
listening=true;
$("micBtn").disabled=true;
$("feedback").textContent="🎤 Jakove, slušam te!";

rec.onresult=e=>{
if(token!==speechToken)return;
const heard=e.results[0][0].transcript;
$("feedback").textContent=
"Čuo sam: "+heard;
completeTask();
};

rec.onerror=e=>{
if(token!==speechToken)return;
$("feedback").textContent=
"Nisam dobro čuo. Pokušaj ponovno ili pozovi roditelja.";
};

rec.onend=()=>{
if(token!==speechToken)return;
listening=false;
$("micBtn").disabled=false;
recognition=null;
};

try{rec.start()}
catch(e){
listening=false;
$("micBtn").disabled=false;
$("feedback").textContent=
"Mikrofon se nije mogao pokrenuti.";
}
}

function nextTask(){
stopRecognition();
if(progress>=8){endGame();return}
if(!taskCompleted){
$("feedback").textContent=
"Prvo pokušaj riješiti izazov, Jakove!";
return;
}
task++;
showTask();
}

function endGame(){
if($("game").classList.contains("hidden"))return;
clearInterval(ticker);
stopRecognition();
if(!done.includes(day))done.push(day);
localStorage.setItem("jakov_game_done",JSON.stringify(done));
$("game").classList.add("hidden");
$("finish").classList.remove("hidden");
drawDays();
say("Bravo, Jakove! Stigao si do cilja! Pravi si junak!");
}

function finishHome(){
if(day<6)day++;
localStorage.setItem("jakov_game_day",day);
home();
}

home();
</script>
</body>
</html>
