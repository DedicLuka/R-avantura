
<!DOCTYPE html>
<html lang="hr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#142657">
<title>Jakovljeva R-avantura</title>
<style>
*{box-sizing:border-box}
:root{--gold:#ffd65a;--blue:#142657;--cyan:#58dff0}
body{margin:0;min-height:100dvh;background:linear-gradient(155deg,#142657,#6540a2);color:#fff;font-family:system-ui,-apple-system,sans-serif}
button{font-family:inherit;cursor:pointer;touch-action:manipulation}
.app{max-width:560px;margin:auto;padding:16px 15px 35px}
header{text-align:center;padding:10px 0}
h1{font-size:29px;margin:5px}
.sub{text-align:center;color:#ddd5ff;font-size:14px}
.panel{background:#ffffff17;border:1px solid #ffffff35;border-radius:23px;padding:17px;margin-bottom:14px}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.day{background:#ffffff20;border:1px solid #ffffff45;color:white;border-radius:12px;padding:12px 2px;font-weight:800}
.day.active{background:var(--gold);color:#242044}
.day.done{border:2px solid #5ce8a4}
.hero{text-align:center;font-size:75px;margin:15px 0}
h2{text-align:center;font-size:23px}
.help{text-align:center;color:#eee4ff;font-size:15px;line-height:1.5}
.primary{width:100%;min-height:62px;border:0;border-radius:18px;background:var(--gold);color:#242044;font-size:20px;font-weight:900;padding:14px}
.listen{width:100%;min-height:105px;background:var(--cyan);color:#07354b;border:0;border-radius:22px;font-size:29px;font-weight:1000;margin:12px 0;box-shadow:0 6px 0 #19899b}
.listen:active{transform:translateY(4px);box-shadow:0 2px 0 #19899b}
.mic{width:100%;min-height:78px;background:#ff85be;color:#43143b;border:0;border-radius:19px;font-size:23px;font-weight:900;margin:8px 0}
.mic:disabled{opacity:.55}
.small{display:block;font-size:14px;font-weight:500;margin-top:5px}
.options{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0}
.option{min-height:110px;background:#ffffff22;border:2px solid #ffffff55;color:white;border-radius:19px;font-size:45px}
.correct{background:#25865f!important;border-color:#b2ffcf!important}
.wrong{background:#963d60!important}
.prompt{text-align:center;font-size:24px;font-weight:900;margin:12px 0}
.progress{height:12px;background:#ffffff30;border-radius:20px;overflow:hidden}
.bar{height:100%;width:0;background:var(--gold);transition:.4s}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.timer{font-size:25px;font-weight:900}
.feedback{text-align:center;font-size:19px;font-weight:800;min-height:35px;margin:12px 0}
.next{width:100%;padding:15px;background:#ffffff22;color:white;border:1px solid #ffffff55;border-radius:15px;font-size:18px;font-weight:800}
.parent{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:12px 0}
.parent button{background:#ffffff20;border:1px solid #ffffff50;color:white;border-radius:12px;padding:12px 5px;font-size:13px}
.track{height:110px;position:relative;background:#ffffff16;border-radius:18px;overflow:hidden;margin:15px 0}
.road{position:absolute;top:65px;width:100%;border-top:5px dashed #ffffff90}
.vehicle{position:absolute;left:5%;top:12px;font-size:60px;transition:left .5s}
.target{position:absolute;right:10px;top:20px;font-size:50px}
.stars{text-align:center;font-size:35px;letter-spacing:5px}
.hidden{display:none!important}
.footer{text-align:center;color:#d0c8ed;font-size:12px;margin-top:18px}
@keyframes pop{50%{transform:scale(1.18)}}
.pop{animation:pop .35s}
</style>
</head>
<body>

<div class="app">
<header>
<h1>🚀 Jakovljeva R-avantura</h1>
<div class="sub">7 dana • 5 minuta • puno zvjezdica!</div>
</header>

<div class="panel"><div id="days" class="days"></div></div>

<section id="home" class="panel">
<div id="homeEmoji" class="hero">🦁</div>
<h2 id="homeTitle"></h2>
<p id="homeDesc" class="help"></p>
<div id="homeStars" class="stars"></div>
<p class="help">Jakove, spreman za novu avanturu?</p>
<button class="primary" onclick="startGame()">🚀 KRENI!</button>
</section>

<section id="game" class="panel hidden">
<div class="top">
<strong id="mission"></strong>
<div class="timer" id="timer">05:00</div>
</div>
<div class="progress"><div id="bar" class="bar"></div></div>
<div class="hero" id="character"></div>
<div class="prompt" id="prompt"></div>
<p class="help" id="help"></p>

<button id="listenBtn" class="listen" onclick="listen()">
🔊 SLUŠAJ
<span class="small">Pritisni da čuješ riječ</span>
</button>

<div id="options" class="options"></div>
<div id="special"></div>

<button id="micBtn" class="mic" onclick="recordSpeech()">
🎤 RECI RIJEČ
<span class="small">Aplikacija sluša Jakova</span>
</button>

<div id="feedback" class="feedback"></div>

<div class="parent">
<button onclick="parentPraise()">👏 Bravo za pokušaj</button>
<button onclick="parentCorrect()">⭐ Pravilno R!</button>
</div>

<button class="next" onclick="nextTask()">SLJEDEĆI IZAZOV ➜</button>
</section>

<section id="finish" class="panel hidden">
<div class="hero">🏆</div>
<h2>Bravo, Jakove!</h2>
<p class="help">Završio si današnju avanturu!</p>
<div class="stars">⭐⭐⭐</div>
<button class="primary" onclick="finishHome()">NASTAVI</button>
</section>

<div class="footer">Vježbe uz roditelja • Bez forsiranja izgovora</div>
</div>

<script>
const praise=[
"Bravo, Jakove! Odlično si to napravio!",
"Svaka čast, Jakove! Pravi si majstor!",
"Fenomenalno, Jakove! Idemo na novi izazov!",
"Super pokušaj, Jakove! Samo tako nastavi!",
"Jakove, osvojio si novu zvjezdicu!",
"Bravo, Jakove! Ponosan sam na tvoj trud!",
"Odlično, Jakove! Ti si pravi istraživač!"
];

const days=[
["Lav ili robot","🦁","Slušaj riječi i razlikuj glasove L i R."],
["Svemirska misija","🚀","Skupljaj predmete koji počinju glasom R."],
["Mali bubnjar","🥁","Prati ritam i igraj se slogovima."],
["Veseli vlak","🚂","Pokreni vlak uz jasne slogove."],
["Ribolov","🎣","Upecaj riječi s glasom R."],
["Velika utrka","🏎️","Slušaj motor i pokušaj izgovoriti R."],
["Veliko finale","🏆","Pokaži sve što si naučio!"]
];

const words=[
{word:"LAV",emoji:"🦁",sound:"L"},
{word:"RIBA",emoji:"🐟",sound:"R"},
{word:"LIMUN",emoji:"🍋",sound:"L"},
{word:"RAKETA",emoji:"🚀",sound:"R"},
{word:"LOPTA",emoji:"⚽",sound:"L"},
{word:"ROBOT",emoji:"🤖",sound:"R"},
{word:"LIST",emoji:"🍃",sound:"L"},
{word:"RAK",emoji:"🦀",sound:"R"},
{word:"LUK",emoji:"🧅",sound:"L"},
{word:"RUKA",emoji:"✋",sound:"R"},
{word:"LISICA",emoji:"🦊",sound:"L"},
{word:"RUŽA",emoji:"🌹",sound:"R"}
];

const rhythms=["DA DA DA","DE DE DE","DI DI DI","TA DA","TE DE","TA TA DA","DA DE DI"];

let day=Number(localStorage.getItem("jakov_day")||0);
let done=JSON.parse(localStorage.getItem("jakov_done")||"[]");
let task=0,seconds=300,ticker=null;
let current=null,answered=false,points=0;
let recognition=null;
const $=id=>document.getElementById(id);

function say(text){
if(!("speechSynthesis" in window))return;
speechSynthesis.cancel();
const u=new SpeechSynthesisUtterance(text);
u.lang="hr-HR";
u.rate=.82;
speechSynthesis.speak(u);
}

function randomPraise(){
const p=praise[Math.floor(Math.random()*praise.length)];
$("feedback").textContent=p;
say(p);
}

function drawDays(){
$("days").innerHTML="";
days.forEach((d,i)=>{
const b=document.createElement("button");
b.className="day"+(day===i?" active":"")+(done.includes(i)?" done":"");
b.textContent=(done.includes(i)?"⭐":"")+(i+1);
b.onclick=()=>{day=i;localStorage.setItem("jakov_day",day);home()};
$("days").appendChild(b);
});
}

function home(){
clearInterval(ticker);
$("home").classList.remove("hidden");
$("game").classList.add("hidden");
$("finish").classList.add("hidden");
$("homeEmoji").textContent=days[day][1];
$("homeTitle").textContent="Dan "+(day+1)+": "+days[day][0];
$("homeDesc").textContent=days[day][2];
$("homeStars").textContent=done.includes(day)?"⭐⭐⭐":"☆☆☆";
drawDays();
}

function startGame(){
task=0;seconds=300;points=0;
$("home").classList.add("hidden");
$("game").classList.remove("hidden");
$("finish").classList.add("hidden");
clearInterval(ticker);
ticker=setInterval(()=>{
seconds--;
$("timer").textContent=
String(Math.floor(Math.max(seconds,0)/60)).padStart(2,"0")+":"+
String(Math.max(seconds,0)%60).padStart(2,"0");
if(seconds<=0)endGame();
},1000);
showTask();
}

function mode(){
if(day===0)return"detective";
if(day===1)return"space";
if(day===2)return"drum";
if(day===3)return"train";
if(day===4)return"fish";
if(day===5)return"race";
return["detective","space","drum","train","fish","race"][task%6];
}

function wordForTask(){
return words[(task*5+day*2)%words.length];
}

function showTask(){
answered=false;
current=wordForTask();
$("feedback").textContent="";
$("options").innerHTML="";
$("special").innerHTML="";
$("bar").style.width=(task/12*100)+"%";
$("mission").textContent="Dan "+(day+1)+" • "+(task+1)+"/12";
$("listenBtn").classList.remove("hidden");
$("micBtn").classList.add("hidden");

const m=mode();

if(m==="detective"){
$("character").textContent=current.emoji;
$("prompt").textContent="Čuješ li L ili R?";
$("help").textContent="Poslušaj riječ i odaberi početni glas.";
makeOptions("🦁 L","🤖 R",current.sound);
}
if(m==="space"){
$("character").textContent=current.emoji;
$("prompt").textContent="U koju kutiju ide predmet?";
$("help").textContent="Riječi s R šaljemo u raketu.";
makeOptions("🌙 L","🚀 R",current.sound);
}
if(m==="fish"){
$("character").textContent=current.emoji;
$("prompt").textContent="Upecaj pravi glas!";
$("help").textContent="Poslušaj riječ i odaberi L ili R.";
makeOptions("🐠 L","🐟 R",current.sound);
}
if(m==="drum"){
$("character").textContent="🥁";
$("prompt").textContent=rhythms[task%rhythms.length];
$("help").textContent="Pritisni bubanj pet puta i ponovi slogove.";
$("listenBtn").classList.add("hidden");
makeDrum();
}
if(m==="train"){
$("character").textContent="🚂";
$("prompt").textContent=task%2?"TE – DE":"TA – DA";
$("help").textContent="Izgovorite slogove i pomaknite vlak.";
$("listenBtn").classList.add("hidden");
makeTrack("🚂","🏁");
}
if(m==="race"){
$("character").textContent="🏎️";
$("prompt").textContent="Pokreni motor!";
$("help").textContent="Pokušaj oponašati RRR. Roditelj može pomoći.";
$("listenBtn").classList.add("hidden");
$("micBtn").classList.remove("hidden");
makeTrack("🏎️","🏆");
}
}

function makeOptions(a,b,correct){
const x=document.createElement("button");
const y=document.createElement("button");
x.className=y.className="option";
x.textContent=a;y.textContent=b;
x.onclick=()=>choose(x,"L",correct);
y.onclick=()=>choose(y,"R",correct);
$("options").append(x,y);
}

function choose(button,choice,correct){
if(answered)return;
answered=true;
if(choice===correct){
button.classList.add("correct");
points++;
randomPraise();
}else{
button.classList.add("wrong");
$("feedback").textContent="Poslušajmo još jednom, Jakove!";
say("Pokušajmo još jednom, Jakove!");
}
}

function makeDrum(){
let hits=0;
const b=document.createElement("button");
b.className="primary";
b.style.minHeight="110px";
b.style.fontSize="38px";
b.textContent="🥁 BUM!";
b.onclick=()=>{
hits++;
b.classList.remove("pop");
void b.offsetWidth;
b.classList.add("pop");
if(hits===5){points++;randomPraise();}
};
$("special").appendChild(b);
}

function makeTrack(vehicle,target){
let pos=5;
const track=document.createElement("div");
track.className="track";
track.innerHTML='<div class="road"></div><div class="vehicle"></div><div class="target"></div>';
track.querySelector(".vehicle").textContent=vehicle;
track.querySelector(".target").textContent=target;
$("special").appendChild(track);
const b=document.createElement("button");
b.className="primary";
b.textContent="▶ POKRENI!";
b.onclick=()=>{
pos=Math.min(pos+18,78);
track.querySelector(".vehicle").style.left=pos+"%";
if(pos>=77&&!answered){
answered=true;
points++;
randomPraise();
}
};
$("special").appendChild(b);
}

function listen(){
if(current)say(current.word.toLowerCase());
}

function parentPraise(){
randomPraise();
}

function parentCorrect(){
points+=2;
$("feedback").textContent="Fantastično, Jakove! Čuo sam lijepi R!";
say("Fantastično, Jakove! Bravo za R!");
}

function recordSpeech(){
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
if(!SR){
$("feedback").textContent="Mikrofon za prepoznavanje govora nije podržan u ovom pregledniku.";
return;
}
if(recognition){try{recognition.abort()}catch(e){}}
speechSynthesis.cancel();
recognition=new SR();
recognition.lang="hr-HR";
recognition.interimResults=false;
recognition.maxAlternatives=1;
$("feedback").textContent="🎤 Jakove, slušam te!";
$("micBtn").disabled=true;
recognition.onresult=e=>{
const heard=e.results[0][0].transcript.toLowerCase();
$("feedback").textContent="Čuo sam: "+heard+". Bravo za pokušaj, Jakove!";
$("micBtn").disabled=false;
setTimeout(()=>say("Bravo za pokušaj, Jakove!"),300);
};
recognition.onerror=e=>{
$("feedback").textContent="Nisam uspio prepoznati govor. Pokušaj ponovno!";
$("micBtn").disabled=false;
};
recognition.onend=()=>{$("micBtn").disabled=false};
try{recognition.start()}catch(e){$("micBtn").disabled=false}
}

function nextTask(){
if(recognition){try{recognition.abort()}catch(e){}}
task++;
if(task>=12){endGame();return}
showTask();
}

function endGame(){
clearInterval(ticker);
if(!done.includes(day))done.push(day);
localStorage.setItem("jakov_done",JSON.stringify(done));
$("game").classList.add("hidden");
$("finish").classList.remove("hidden");
drawDays();
say("Bravo, Jakove! Završio si današnju avanturu! Osvojio si tri zvjezdice!");
}

function finishHome(){
if(day<6)day++;
localStorage.setItem("jakov_day",day);
home();
}

home();
</script>
</body>
</html>
