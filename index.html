
<!DOCTYPE html>
<html lang="hr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14234b">
<title>Jakovljeva R-avantura 4.0</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{
 font-family:system-ui,-apple-system,sans-serif;
 color:white;
 background:linear-gradient(150deg,#14234b,#49318a);
}
button{font:inherit;cursor:pointer;touch-action:manipulation}
button:disabled{opacity:.5}
.app{
 height:100dvh;
 max-width:560px;
 margin:auto;
 padding:max(5px,env(safe-area-inset-top)) 10px
 max(5px,env(safe-area-inset-bottom));
 display:flex;
 flex-direction:column;
 gap:5px;
 overflow:hidden;
}
header{text-align:center;flex-shrink:0}
h1{font-size:clamp(17px,4.7vw,24px);margin:2px}
.sub{font-size:11px;color:#ddd6ff}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;flex-shrink:0}
.day{
 border:1px solid #ffffff50;
 border-radius:10px;
 background:#ffffff20;
 color:white;
 min-height:32px;
 font-weight:800;
}
.day.active{background:#ffdc67;color:#252044}
.day.done{border:2px solid #58e6a1}
.panel{
 background:#ffffff15;
 border:1px solid #ffffff30;
 border-radius:17px;
 padding:9px;
}
#home,#finish{
 flex:1;
 display:flex;
 flex-direction:column;
 justify-content:center;
 align-items:center;
 gap:12px;
}
#game{
 flex:1;
 min-height:0;
 display:flex;
 flex-direction:column;
 gap:5px;
}
.hidden{display:none!important}
.top{display:flex;justify-content:space-between;font-size:13px;font-weight:800}
.timer{font-size:19px}
.progress{height:7px;background:#ffffff35;border-radius:10px;overflow:hidden}
.bar{height:100%;width:0;background:#ffdc67;transition:.4s}
.world{
 position:relative;
 flex:1;
 min-height:70px;
 max-height:225px;
 border-radius:15px;
 overflow:hidden;
 background:linear-gradient(#72c6eb,#5589c6);
}
.world.space{background:radial-gradient(circle at 70% 25%,#5144a6,#09142d)}
.world.ocean{background:linear-gradient(#49bed8,#08477d)}
.world.forest{background:linear-gradient(#8bd1ee 0 60%,#478f59 60%)}
.world.road{background:linear-gradient(#80c5e5 0 55%,#4b8b5b 55%)}
.path{
 position:absolute;left:8%;right:8%;bottom:29%;
 height:6px;background:#ffffff99;border-radius:10px;
}
.actor{
 position:absolute;left:7%;bottom:35%;
 font-size:clamp(38px,8vh,65px);
 transition:left .65s ease;
}
.goal{
 position:absolute;right:4%;bottom:35%;
 font-size:clamp(34px,7vh,56px);
}
.worldName{
 position:absolute;top:7px;left:8px;
 background:#0005;border-radius:9px;
 padding:5px 9px;font-size:11px;font-weight:800;
}
.distance{
 position:absolute;bottom:5px;width:100%;
 text-align:center;font-size:12px;font-weight:800;
}
.exercise{
 text-align:center;
 display:flex;
 flex-direction:column;
 justify-content:center;
 gap:3px;
 flex-shrink:0;
}
.exerciseIcon{font-size:clamp(25px,5vh,42px)}
.exerciseTitle{
 font-size:clamp(18px,4.5vw,24px);
 font-weight:900;
}
.exerciseHelp{
 font-size:clamp(12px,3vw,14px);
 color:#e9e3ff;
 line-height:1.3;
}
.count{
 text-align:center;
 font-size:17px;
 font-weight:900;
 color:#ffdc67;
}
.listen{
 width:100%;min-height:45px;
 border:0;border-radius:13px;
 background:#60e4f5;color:#083a50;
 font-size:18px;font-weight:900;
 flex-shrink:0;
}
.mic{
 width:100%;min-height:47px;
 border:0;border-radius:13px;
 background:#ff8cbe;color:#4b1740;
 font-size:18px;font-weight:900;
 flex-shrink:0;
}
.letters{
 display:grid;grid-template-columns:1fr 1fr;
 gap:9px;flex-shrink:0;
}
.letters:empty{display:none}
.letter{
 min-height:62px;border:2px solid #ffffff55;
 border-radius:14px;background:#ffffff20;
 color:white;font-size:42px;font-weight:900;
}
.letter.correct{background:#25845b}
.letter.wrong{background:#9a3d65}
.feedback{
 min-height:19px;text-align:center;
 font-size:13px;font-weight:800;
}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:7px;flex-shrink:0}
.actions button{
 min-height:42px;border:1px solid #ffffff45;
 border-radius:12px;background:#ffffff24;
 color:white;font-size:13px;font-weight:800;
}
.actions .confirm{background:#37b88a;color:#082d25;border:0}
.next{
 width:100%;min-height:40px;
 background:#ffdc67;color:#242044;
 border:0;border-radius:12px;
 font-size:16px;font-weight:900;
 flex-shrink:0;
}
.bigEmoji{font-size:75px;text-align:center}
h2{text-align:center;font-size:22px;margin:3px}
.desc{text-align:center;color:#e8e1ff;font-size:15px}
.start{
 width:100%;min-height:57px;
 background:#ffdc67;border:0;border-radius:14px;
 font-size:19px;font-weight:900;color:#242044;
}
.footer{text-align:center;font-size:9px;color:#cfc5ee;flex-shrink:0}
@keyframes bounce{
 50%{transform:translateY(-13px) scale(1.1)}
}
.bounce{animation:bounce .5s}
@media(max-height:730px){
 .app{gap:3px}
 .panel{padding:6px}
 .day{min-height:27px}
 .world{min-height:50px}
 .exerciseIcon{font-size:25px}
 .exerciseTitle{font-size:18px}
 .exerciseHelp{font-size:11px}
 .listen,.mic{min-height:38px;font-size:15px}
 .letter{min-height:44px;font-size:30px}
 .actions button{min-height:35px}
 .next{min-height:34px}
 .feedback{min-height:15px;font-size:11px}
}
@media(max-height:540px){
 .sub,.footer,.exerciseIcon{display:none}
 .world{min-height:35px}
 .actor{font-size:30px}
 .goal{font-size:28px}
 .exerciseHelp{font-size:10px}
 .listen,.mic{min-height:30px}
 .actions button{min-height:29px}
 .next{min-height:29px}
}
</style>
</head>
<body>
<div class="app">

<header>
<h1>🚀 Jakovljeva R-avantura</h1>
<div class="sub">Pokreni jezik • Izgovori • Stigni do cilja!</div>
</header>

<div id="days" class="days"></div>

<section id="home" class="panel">
<div id="homeIcon" class="bigEmoji"></div>
<h2 id="homeTitle"></h2>
<p id="homeDesc" class="desc"></p>
<button class="start" onclick="startGame()">▶ KRENI!</button>
</section>

<section id="game" class="panel hidden">
<div class="top">
<span id="mission"></span>
<span id="timer" class="timer">05:00</span>
</div>

<div class="progress"><div id="bar" class="bar"></div></div>

<div id="world" class="world">
<div id="worldName" class="worldName"></div>
<div class="path"></div>
<div id="actor" class="actor"></div>
<div id="goal" class="goal"></div>
<div id="distance" class="distance"></div>
</div>

<div class="exercise">
<div id="exerciseIcon" class="exerciseIcon"></div>
<div id="exerciseTitle" class="exerciseTitle"></div>
<div id="exerciseHelp" class="exerciseHelp"></div>
</div>

<div id="count" class="count"></div>

<button id="listenBtn" class="listen" onclick="listen()">
🔊 SLUŠAJ UPUTU
</button>

<div id="letters" class="letters"></div>

<button id="micBtn" class="mic" onclick="recordSpeech()">
🎤 IZGOVORI SLOG
</button>

<div id="feedback" class="feedback"></div>

<div class="actions">
<button id="repeatBtn" onclick="repeatDone()">
👅 Izvedeno 1×
</button>
<button id="confirmBtn" class="confirm" onclick="parentConfirm()">
👏 POTVRDI
</button>
</div>

<button id="nextBtn" class="next" onclick="nextTask()">
SLJEDEĆA VJEŽBA ➜
</button>
</section>

<section id="finish" class="panel hidden">
<div class="bigEmoji">🏆</div>
<h2>Bravo, Jakove!</h2>
<p id="finishText" class="desc"></p>
<div style="font-size:35px">⭐⭐⭐</div>
<button class="start" onclick="finishHome()">NASTAVI</button>
</section>

<div class="footer">
Vježbe uz roditelja • Bez boli i forsiranja • Mikrofon ne ocjenjuje R
</div>
</div>

<script>
const $=id=>document.getElementById(id);

const missions=[
 {name:"Svemirska misija",actor:"🚀",goal:"🌕",world:"space"},
 {name:"Automobilska utrka",actor:"🏎️",goal:"🏁",world:"road"},
 {name:"Veseli vlak",actor:"🚂",goal:"🏰",world:"forest"},
 {name:"Potraga za blagom",actor:"🤿",goal:"💎",world:"ocean"},
 {name:"Šumska pustolovina",actor:"🦊",goal:"🏡",world:"forest"},
 {name:"Velika utrka",actor:"🏎️",goal:"🏆",world:"road"},
 {name:"Završna misija",actor:"🚀",goal:"🏆",world:"space"}
];

const exercises=[
 {
 type:"movement",icon:"👅",
 title:"Jezik prema gore",
 help:"Podigni vrh jezika iza gornjih zuba.",
 instruction:"Jakove, podigni vrh jezika iza gornjih zuba. Polako, pet puta.",
 reps:5
 },
 {
 type:"movement",icon:"🐴",
 title:"Konjić",
 help:"Cokći jezikom kao konjić.",
 instruction:"Jakove, napravi pet zvukova konjića jezikom.",
 reps:5
 },
 {
 type:"speech",icon:"🥁",
 title:"Bubanj",
 help:"Izgovori DA – DA – DA.",
 instruction:"Jakove, ponovi: da, da, da.",
 word:"DA DA DA",reps:3
 },
 {
 type:"movement",icon:"↔️",
 title:"Jezik lijevo-desno",
 help:"Dotakni jezikom lijevi pa desni kut usana.",
 instruction:"Jakove, pomakni jezik lijevo pa desno. Ponovi tri puta.",
 reps:3
 },
 {
 type:"speech",icon:"🚂",
 title:"Pokreni vlak",
 help:"Izgovori TA – DA – TA – DA.",
 instruction:"Jakove, ponovi: ta, da, ta, da.",
 word:"TA DA TA DA",reps:2
 },
 {
 type:"movement",icon:"🎯",
 title:"Pogodi točku",
 help:"Vrhom jezika dodirni mjesto iza gornjih zuba.",
 instruction:"Jakove, dodirni jezikom mjesto iza gornjih zuba. Pet puta.",
 reps:5
 },
 {
 type:"speech",icon:"🔊",
 title:"Brzi bubanj",
 help:"Ponovi DE – DE – DE, ugodnim tempom.",
 instruction:"Jakove, ponovi: de, de, de.",
 word:"DE DE DE",reps:3
 },
 {
 type:"speech",icon:"⭐",
 title:"Pokušaj glas R",
 help:"Pokušaj R samo ako je ugodno. Možeš i ponoviti DA.",
 instruction:"Jakove, pokušaj izgovoriti glas er. Ako je teško, ponovi da.",
 word:"R",reps:2
 },
 {
 type:"listen",icon:"👂",
 title:"Čuješ li L ili R?",
 help:"Poslušaj riječ i odaberi početno slovo.",
 instruction:"Poslušaj riječ.",
 reps:1
 },
 {
 type:"speech",icon:"🎵",
 title:"Slogovi",
 help:"Izgovori TA – DA – DE.",
 instruction:"Jakove, ponovi: ta, da, de.",
 word:"TA DA DE",reps:2
 }
];

const words=[
 {word:"RIBA",sound:"R"},
 {word:"LAV",sound:"L"},
 {word:"RAK",sound:"R"},
 {word:"LIMUN",sound:"L"},
 {word:"ROBOT",sound:"R"},
 {word:"LOPTA",sound:"L"},
 {word:"RUKA",sound:"R"},
 {word:"LIST",sound:"L"}
];

const praise=[
"Bravo, Jakove! Napreduješ!",
"Odlično, Jakove! Još malo do cilja!",
"Svaka čast, Jakove!",
"Super pokušaj, Jakove!",
"Jakove, tvoj junak ide dalje!",
"Bravo, Jakove! Pravi si istraživač!"
];

let day=Number(localStorage.getItem("jakov_r4_day")||0);
let done=JSON.parse(localStorage.getItem("jakov_r4_done")||"[]");
let task=0,progress=0,repeats=0;
let seconds=300,ticker=null;
let current=null,completed=false,ending=false;
let recognition=null,token=0;

function say(t){
 if(!("speechSynthesis" in window))return;
 speechSynthesis.cancel();
 const u=new SpeechSynthesisUtterance(t);
 u.lang="hr-HR";
 u.rate=.82;
 speechSynthesis.speak(u);
}

function drawDays(){
 $("days").innerHTML="";
 missions.forEach((m,i)=>{
  const b=document.createElement("button");
  b.className="day"+(i===day?" active":"")+
   (done.includes(i)?" done":"");
  b.textContent=(done.includes(i)?"⭐":"")+(i+1);
  b.onclick=()=>{
   day=i;
   localStorage.setItem("jakov_r4_day",day);
   home();
  };
  $("days").appendChild(b);
 });
}

function home(){
 clearInterval(ticker);
 stopRecognition();
 $("home").classList.remove("hidden");
 $("game").classList.add("hidden");
 $("finish").classList.add("hidden");
 $("homeIcon").textContent=missions[day].actor;
 $("homeTitle").textContent="Dan "+(day+1)+": "+missions[day].name;
 $("homeDesc").textContent="Izvedi vježbe i stigni do cilja!";
 drawDays();
}

function startGame(){
 task=0;progress=0;repeats=0;seconds=300;ending=false;
 $("timer").textContent="05:00";
 $("home").classList.add("hidden");
 $("finish").classList.add("hidden");
 $("game").classList.remove("hidden");
 const m=missions[day];
 $("world").className="world "+m.world;
 $("worldName").textContent=m.name;
 $("actor").textContent=m.actor;
 $("goal").textContent=m.goal;
 clearInterval(ticker);
 ticker=setInterval(()=>{
  seconds--;
  $("timer").textContent=
   String(Math.floor(Math.max(0,seconds)/60)).padStart(2,"0")+
   ":"+String(Math.max(0,seconds)%60).padStart(2,"0");
  if(seconds<=0)endGame();
 },1000);
 showTask();
}

function exerciseForTask(){
 const order=[
  [0,2,1,4,5,6,3,7],
  [1,4,0,6,3,2,5,8],
  [5,2,1,9,0,4,3,7],
  [3,6,5,2,1,4,0,8],
  [0,9,3,4,5,2,1,7],
  [1,6,0,4,3,9,5,8],
  [5,2,3,4,0,6,1,7]
 ];
 return {...exercises[order[day][task]]};
}

function showTask(){
 completed=false;
 repeats=0;
 current=exerciseForTask();
 $("mission").textContent="Dan "+(day+1)+" • "+(task+1)+"/8";
 $("exerciseIcon").textContent=current.icon;
 $("exerciseTitle").textContent=current.title;
 $("exerciseHelp").textContent=current.help;
 $("feedback").textContent="";
 $("letters").innerHTML="";
 $("micBtn").classList.toggle("hidden",current.type!=="speech");
 $("repeatBtn").classList.toggle("hidden",current.type==="listen");
 $("confirmBtn").classList.toggle("hidden",current.type==="listen");
 $("listenBtn").textContent="🔊 SLUŠAJ UPUTU";
 $("nextBtn").disabled=true;

 if(current.type==="listen"){
  const w=words[(task+day*2)%words.length];
  current.word=w.word;
  current.sound=w.sound;
  $("listenBtn").textContent="🔊 SLUŠAJ RIJEČ";
  ["L","R"].forEach(letter=>{
   const b=document.createElement("button");
   b.className="letter";
   b.textContent=letter;
   b.onclick=()=>{
    if(completed)return;
    if(letter===current.sound){
     b.classList.add("correct");
     completeTask();
    }else{
     b.classList.add("wrong");
     $("feedback").textContent="Pokušaj još jednom, Jakove!";
     say("Pokušaj još jednom, Jakove!");
    }
   };
   $("letters").appendChild(b);
  });
 }
 updateCount();
 updateWorld();
}

function updateCount(){
 $("count").textContent=current.type==="listen"?
 "Odaberi slovo L ili R":
 "Ponavljanja: "+repeats+" / "+current.reps;
}

function listen(){
 if(!current)return;
 say(current.type==="listen"?
  current.word.toLowerCase():current.instruction);
}

function repeatDone(){
 if(completed)return;
 repeats=Math.min(repeats+1,current.reps);
 updateCount();
 if(repeats>=current.reps){
  $("feedback").textContent=
   "Jakove, pozovi roditelja da potvrdi!";
 }
}

function parentConfirm(){
 if(completed)return;
 completeTask();
}

function updateWorld(){
 $("actor").style.left=(7+progress/8*65)+"%";
 $("distance").textContent="Napredak: "+progress+" / 8";
 $("bar").style.width=(progress/8*100)+"%";
}

function completeTask(){
 if(completed||ending)return;
 completed=true;
 progress=Math.min(8,progress+1);
 updateWorld();
 $("actor").classList.remove("bounce");
 void $("actor").offsetWidth;
 $("actor").classList.add("bounce");
 $("nextBtn").disabled=false;
 const p=praise[Math.floor(Math.random()*praise.length)];
 $("feedback").textContent=p;
 say(p);
 if(progress>=8){
  ending=true;
  setTimeout(endGame,1800);
 }
}

function stopRecognition(){
 token++;
 if(recognition){
  try{recognition.abort()}catch(e){}
  recognition=null;
 }
 $("micBtn").disabled=false;
}

function recordSpeech(){
 if(completed)return;
 const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!SR){
  $("feedback").textContent=
   "Mikrofon nije podržan. Roditelj može potvrditi pokušaj.";
  return;
 }
 speechSynthesis.cancel();
 stopRecognition();
 const myToken=++token;
 const rec=new SR();
 recognition=rec;
 rec.lang="hr-HR";
 rec.continuous=false;
 rec.interimResults=false;
 $("micBtn").disabled=true;
 $("feedback").textContent="🎤 Slušam te, Jakove!";
 rec.onresult=e=>{
  if(myToken!==token)return;
  const heard=e.results[0][0].transcript;
  repeats=Math.min(repeats+1,current.reps);
  updateCount();
  $("feedback").textContent=
   "Čuo sam: "+heard+". Roditelj može potvrditi.";
 };
 rec.onerror=()=>{
  if(myToken!==token)return;
  $("feedback").textContent=
   "Nisam dobro čuo. Pokušaj opet ili pozovi roditelja.";
 };
 rec.onend=()=>{
  if(myToken!==token)return;
  recognition=null;
  $("micBtn").disabled=false;
 };
 try{rec.start()}
 catch(e){
  recognition=null;
  $("micBtn").disabled=false;
  $("feedback").textContent="Mikrofon nije dostupan.";
 }
}

function nextTask(){
 if(!completed)return;
 stopRecognition();
 if(progress>=8){endGame();return}
 task++;
 showTask();
}

function endGame(){
 if($("game").classList.contains("hidden"))return;
 clearInterval(ticker);
 stopRecognition();
 $("game").classList.add("hidden");
 $("finish").classList.remove("hidden");
 if(progress>=8){
  if(!done.includes(day))done.push(day);
  $("finishText").textContent="Stigao si do cilja!";
 }else{
  $("finishText").textContent=
   "Odličan trud! Danas si napravio "+progress+" koraka.";
 }
 localStorage.setItem("jakov_r4_done",JSON.stringify(done));
 drawDays();
 say("Bravo, Jakove! Završio si današnju avanturu!");
}

function finishHome(){
 if(day<6)day++;
 localStorage.setItem("jakov_r4_day",day);
 home();
}

home();
</script>
</body>
</html>
