
<!DOCTYPE html>
<html lang="hr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101d43">
<title>Jakovljeva R-avantura</title>
<style>
*{box-sizing:border-box}
:root{
 --gold:#ffda63;
 --cyan:#60e4f5;
 --pink:#ff88b8;
 --green:#5ce6a4;
}
html,body{
 margin:0;
 width:100%;
 height:100%;
 overflow:hidden;
 overscroll-behavior:none;
}
body{
 background:linear-gradient(160deg,#101d43,#47318a);
 color:white;
 font-family:system-ui,-apple-system,sans-serif;
}
button{
 font-family:inherit;
 cursor:pointer;
 touch-action:manipulation;
}
button:disabled{opacity:.55}
.app{
 width:100%;
 max-width:560px;
 height:100dvh;
 margin:auto;
 padding:
 max(6px,env(safe-area-inset-top))
 10px
 max(6px,env(safe-area-inset-bottom));
 display:flex;
 flex-direction:column;
 gap:6px;
 overflow:hidden;
}
header{
 text-align:center;
 flex-shrink:0;
}
h1{
 font-size:clamp(18px,4.8vw,24px);
 margin:2px 0;
}
.sub{
 font-size:11px;
 color:#ddd5ff;
}
.panel{
 background:#ffffff15;
 border:1px solid #ffffff35;
 border-radius:16px;
 padding:9px;
 min-height:0;
}
.days{
 display:grid;
 grid-template-columns:repeat(7,1fr);
 gap:4px;
}
.day{
 background:#ffffff20;
 border:1px solid #ffffff40;
 color:white;
 border-radius:9px;
 min-height:30px;
 font-size:12px;
 font-weight:800;
}
.day.active{
 background:var(--gold);
 color:#202044;
}
.day.done{border:2px solid var(--green)}
#home,#finish{
 flex:1;
 display:flex;
 flex-direction:column;
 align-items:center;
 justify-content:center;
 gap:12px;
}
.hero{
 text-align:center;
 font-size:clamp(55px,12vh,90px);
}
h2{
 text-align:center;
 font-size:22px;
 margin:5px;
}
.help{
 text-align:center;
 color:#e8e2ff;
 line-height:1.25;
 font-size:clamp(12px,2.8vw,14px);
 margin:3px 0;
}
.primary{
 width:100%;
 min-height:48px;
 background:var(--gold);
 border:0;
 border-radius:13px;
 color:#292044;
 font-size:17px;
 font-weight:900;
}
#game{
 flex:1;
 display:flex;
 flex-direction:column;
 gap:5px;
 overflow:hidden;
}
.top{
 display:flex;
 justify-content:space-between;
 align-items:center;
 flex-shrink:0;
 font-size:12px;
}
.timer{
 font-size:18px;
 font-weight:900;
}
.progress{
 height:7px;
 background:#ffffff30;
 border-radius:20px;
 overflow:hidden;
 flex-shrink:0;
}
.bar{
 height:100%;
 width:0;
 background:var(--gold);
 transition:.4s;
}
.world{
 position:relative;
 flex:1;
 min-height:75px;
 max-height:240px;
 overflow:hidden;
 border-radius:14px;
 background:linear-gradient(#3471bf,#83c5ed);
}
.world.space{
 background:radial-gradient(circle at 70% 20%,#4544a0,#09152e);
}
.world.ocean{
 background:linear-gradient(#45b9d6,#075184);
}
.world.roadworld{
 background:linear-gradient(#78c5eb 0 60%,#47764d 60%);
}
.world.forest{
 background:linear-gradient(#79c9ee,#60aa77);
}
.world:before{
 content:"✦ ✧ ✦";
 position:absolute;
 top:8px;
 right:15px;
 font-size:18px;
 opacity:.6;
}
.path{
 position:absolute;
 left:8%;
 right:8%;
 bottom:29%;
 height:6px;
 background:#ffffff80;
 border-radius:20px;
}
.actor{
 position:absolute;
 left:7%;
 bottom:34%;
 font-size:clamp(35px,8vh,65px);
 transition:left .65s ease;
 z-index:2;
}
.goal{
 position:absolute;
 right:4%;
 bottom:34%;
 font-size:clamp(32px,7vh,55px);
}
.worldLabel{
 position:absolute;
 top:7px;
 left:9px;
 font-size:11px;
 font-weight:800;
 background:#0004;
 border-radius:9px;
 padding:5px 8px;
}
.stepText{
 position:absolute;
 bottom:5px;
 left:0;
 width:100%;
 text-align:center;
 font-size:11px;
 font-weight:800;
}
.prompt{
 font-size:clamp(17px,4.5vw,23px);
 text-align:center;
 font-weight:900;
 margin:2px 0;
 flex-shrink:0;
}
.listen{
 width:100%;
 min-height:49px;
 background:var(--cyan);
 color:#073c53;
 border:0;
 border-radius:13px;
 font-size:19px;
 font-weight:900;
 flex-shrink:0;
}
.mic{
 width:100%;
 min-height:51px;
 background:var(--pink);
 color:#4b1640;
 border:0;
 border-radius:13px;
 font-size:19px;
 font-weight:900;
 flex-shrink:0;
}
.small{
 display:block;
 font-size:10px;
 font-weight:500;
}
.options{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:8px;
 flex-shrink:0;
}
.options:empty{display:none}
.option{
 min-height:62px;
 border-radius:13px;
 background:#ffffff20;
 border:2px solid #ffffff50;
 color:white;
 font-size:42px;
 font-weight:900;
}
.option.correct{background:#20865c}
.option.wrong{background:#963c62}
.feedback{
 text-align:center;
 min-height:22px;
 font-size:clamp(12px,3vw,15px);
 font-weight:800;
 flex-shrink:0;
}
.parent{
 display:flex;
 gap:6px;
 align-items:center;
 flex-shrink:0;
}
.parentTitle{
 font-size:10px;
 color:#d8d0ff;
 width:72px;
}
.parent button{
 flex:1;
 background:#ffffff25;
 border:1px solid #ffffff50;
 color:white;
 padding:8px 5px;
 border-radius:10px;
 font-size:12px;
 font-weight:800;
}
.next{
 width:100%;
 min-height:42px;
 background:#ffffff25;
 border:1px solid #ffffff50;
 color:white;
 border-radius:12px;
 font-size:15px;
 font-weight:800;
 flex-shrink:0;
}
.stars{
 text-align:center;
 font-size:30px;
}
.hidden{display:none!important}
.footer{
 text-align:center;
 font-size:9px;
 color:#c8c0e8;
 flex-shrink:0;
}
@keyframes celebrate{
 0%,100%{transform:scale(1)}
 50%{transform:scale(1.2) rotate(-7deg)}
}
.celebrate{animation:celebrate .5s}

/* Mali iPhone zasloni */
@media(max-height:750px){
 .app{gap:4px}
 .panel{padding:6px}
 .day{min-height:26px}
 .world{min-height:60px}
 .listen{min-height:43px}
 .mic{min-height:44px}
 .option{min-height:52px;font-size:35px}
 .next{min-height:37px}
 .help{font-size:11px}
 .parent button{padding:6px 4px}
}
/* Vrlo niski zasloni ili landscape */
@media(max-height:560px){
 header .sub,.footer,#help{display:none}
 h1{font-size:17px}
 .world{min-height:45px}
 .actor{font-size:34px}
 .goal{font-size:30px}
 .listen,.mic{min-height:35px;font-size:15px}
 .small{display:none}
 .option{min-height:36px;font-size:26px}
 .next{min-height:32px}
 .parent button{padding:4px}
 .feedback{min-height:16px}
}
</style>
</head>
<body>

<div class="app">

<header>
<h1>🚀 Jakovljeva R-avantura</h1>
<div class="sub">Govori • Igraj • Osvoji cilj!</div>
</header>

<div class="panel">
<div id="days" class="days"></div>
</div>

<section id="home" class="panel">
<div id="homeEmoji" class="hero">🚀</div>
<h2 id="homeTitle"></h2>
<p id="homeDesc" class="help"></p>
<div id="homeStars" class="stars"></div>
<button class="primary" onclick="startGame()">
▶ ZAPOČNI MISIJU
</button>
</section>

<section id="game" class="panel hidden">
<div class="top">
<strong id="mission"></strong>
<div class="timer" id="timer">05:00</div>
</div>

<div class="progress">
<div id="bar" class="bar"></div>
</div>

<div id="world" class="world">
<div id="worldLabel" class="worldLabel"></div>
<div class="path"></div>
<div id="actor" class="actor">🚀</div>
<div id="goal" class="goal">🌕</div>
<div id="stepText" class="stepText"></div>
</div>

<div id="prompt" class="prompt"></div>
<p id="help" class="help"></p>

<button id="listenBtn" class="listen" onclick="listen()">
🔊 SLUŠAJ
<span class="small">Čuj riječ ili slog</span>
</button>

<div id="options" class="options"></div>

<button id="micBtn" class="mic" onclick="recordSpeech()">
🎤 IZGOVORI
<span class="small">Jakove, sada si ti na redu!</span>
</button>

<div id="feedback" class="feedback"></div>

<div class="parent">
<div class="parentTitle">RODITELJ</div>
<button onclick="parentConfirm()">
👏 Potvrdi pokušaj
</button>
</div>

<button class="next" onclick="nextTask()">
SLJEDEĆI IZAZOV ➜
</button>
</section>

<section id="finish" class="panel hidden">
<div class="hero">🏆</div>
<h2>Misija završena!</h2>
<p class="help">Jakove, stigao si do cilja!</p>
<div class="stars">⭐⭐⭐</div>
<button class="primary" onclick="finishHome()">
NASTAVI AVANTURU
</button>
</section>

<div class="footer">
Vježbe uz roditelja • Mikrofon ne ocjenjuje pravilnost R
</div>
</div>

<script>
const $=id=>document.getElementById(id);

const praise=[
"Bravo, Jakove! Ideš prema cilju!",
"Odlično, Jakove! Samo tako!",
"Svaka čast, Jakove! Pravi si junak!",
"Fenomenalno, Jakove! Još malo!",
"Super pokušaj, Jakove!",
"Jakove, osvojio si novu zvjezdicu!",
"Bravo, Jakove! Uspio si!"
];

const days=[
{title:"Svemirska misija",emoji:"🚀",desc:"Izgovaraj slogove i poleti do Mjeseca!",actor:"🚀",goal:"🌕",world:"space"},
{title:"Utrka automobila",emoji:"🏎️",desc:"Svaki slog pomiče automobil prema cilju.",actor:"🏎️",goal:"🏁",world:"roadworld"},
{title:"Putovanje vlakom",emoji:"🚂",desc:"Pokreni vlak govornim zadacima.",actor:"🚂",goal:"🏰",world:"forest"},
{title:"Potraga za blagom",emoji:"🤿",desc:"Zaroni i pronađi skriveno blago.",actor:"🤿",goal:"💎",world:"ocean"},
{title:"Šumska avantura",emoji:"🦊",desc:"Pronađi put kroz čarobnu šumu.",actor:"🦊",goal:"🏡",world:"forest"},
{title:"Velika utrka",emoji:"🏎️",desc:"Pobijedi u utrci izgovaranjem slogova.",actor:"🏎️",goal:"🏆",world:"roadworld"},
{title:"Završna misija",emoji:"🚀",desc:"Pokaži sve što si naučio!",actor:"🚀",goal:"🏆",world:"space"}
];

const syllables=[
"DA","DE","DI","DO","DU",
"TA","TE","TI","TO","TU",
"LA","LE","LI","LO","LU",
"RA","RE","RI","RO","RU"
];

const words=[
{word:"LAV",sound:"L"},
{word:"RIBA",sound:"R"},
{word:"LIMUN",sound:"L"},
{word:"RAK",sound:"R"},
{word:"LOPTA",sound:"L"},
{word:"ROBOT",sound:"R"},
{word:"LIST",sound:"L"},
{word:"RUKA",sound:"R"},
{word:"LUK",sound:"L"},
{word:"RUŽA",sound:"R"}
];

let day=Number(localStorage.getItem("jakov_game_day")||0);
let done=JSON.parse(localStorage.getItem("jakov_game_done")||"[]");
let task=0,progress=0,seconds=300,ticker=null;
let recognition=null,listening=false,current=null;
let taskCompleted=false,speechToken=0;
let ending=false;

function say(text){
if(!("speechSynthesis" in window))return;
speechSynthesis.cancel();
const u=new SpeechSynthesisUtterance(text);
u.lang="hr-HR";
u.rate=.82;
speechSynthesis.speak(u);
}

function randomPraise(){
const p=praise[Math.floor(Math.random()*praise.length)];
$("feedback").textContent=p;
say(p);
}

function drawDays(){
$("days").innerHTML="";
days.forEach((d,i)=>{
const b=document.createElement("button");
b.className="day"+(day===i?" active":"")+
(done.includes(i)?" done":"");
b.textContent=(done.includes(i)?"⭐":"")+(i+1);
b.onclick=()=>{
day=i;
localStorage.setItem("jakov_game_day",day);
home();
};
$("days").appendChild(b);
});
}

function home(){
clearInterval(ticker);
stopRecognition();
$("home").classList.remove("hidden");
$("game").classList.add("hidden");
$("finish").classList.add("hidden");
$("homeEmoji").textContent=days[day].emoji;
$("homeTitle").textContent="Dan "+(day+1)+": "+days[day].title;
$("homeDesc").textContent=days[day].desc;
$("homeStars").textContent=done.includes(day)?"⭐⭐⭐":"☆☆☆";
drawDays();
}

function startGame(){
task=0;progress=0;seconds=300;ending=false;
$("timer").textContent="05:00";
$("home").classList.add("hidden");
$("finish").classList.add("hidden");
$("game").classList.remove("hidden");
clearInterval(ticker);
ticker=setInterval(()=>{
seconds--;
$("timer").textContent=
String(Math.floor(Math.max(seconds,0)/60)).padStart(2,"0")+
":"+
String(Math.max(seconds,0)%60).padStart(2,"0");
if(seconds<=0)endGame();
},1000);
showTask();
}

function taskType(){
if(task%4===0)return"listen";
if(task%4===1)return"syllable";
if(task%4===2)return"sequence";
return"word";
}

function getTask(){
const type=taskType();
if(type==="listen"||type==="word"){
return{type,...words[(task+day*3)%words.length]};
}
if(type==="syllable"){
return{type,word:syllables[(task+day*2)%syllables.length]};
}
const sequences=[
"DA DA DA","DE DE DE","TA DA",
"TE DE","DI DI DI","LA LA LA","RA RA RA"
];
return{type,word:sequences[(task+day)%sequences.length]};
}

function showTask(){
taskCompleted=false;
current=getTask();
$("feedback").textContent="";
$("options").innerHTML="";
$("bar").style.width=(progress/8*100)+"%";
$("mission").textContent="Dan "+(day+1)+" • "+(task+1)+"/8";

const d=days[day];
$("world").className="world "+d.world;
$("worldLabel").textContent=d.title;
$("actor").textContent=d.actor;
$("goal").textContent=d.goal;
updateActor();

$("listenBtn").classList.remove("hidden");
$("micBtn").classList.remove("hidden");

if(current.type==="listen"){
$("prompt").textContent="Čuješ li L ili R?";
$("help").textContent="Poslušaj riječ i odaberi slovo.";
$("micBtn").classList.add("hidden");
makeLetterOptions();
}
if(current.type==="syllable"){
$("prompt").textContent=current.word;
$("help").textContent="Poslušaj i ponovi slog.";
}
if(current.type==="sequence"){
$("prompt").textContent=current.word;
$("help").textContent="Ponovi niz slogova.";
}
if(current.type==="word"){
$("prompt").textContent=current.word;
$("help").textContent="Poslušaj i izgovori riječ.";
}
}

function makeLetterOptions(){
["L","R"].forEach(letter=>{
const b=document.createElement("button");
b.className="option";
b.textContent=letter;
b.onclick=()=>{
if(taskCompleted)return;
if(letter===current.sound){
b.classList.add("correct");
completeTask();
}else{
b.classList.add("wrong");
$("feedback").textContent="Poslušaj još jednom, Jakove!";
say("Poslušaj još jednom, Jakove!");
}
};
$("options").appendChild(b);
});
}

function listen(){
if(current)say(current.word.toLowerCase());
}

function updateActor(){
const pct=Math.min(progress/8,1);
$("actor").style.left=(7+pct*65)+"%";
$("stepText").textContent="Prijeđeno "+progress+" od 8 koraka";
}

function completeTask(){
if(taskCompleted||ending)return;
taskCompleted=true;
progress=Math.min(progress+1,8);
updateActor();
$("bar").style.width=(progress/8*100)+"%";
$("actor").classList.remove("celebrate");
void $("actor").offsetWidth;
$("actor").classList.add("celebrate");
randomPraise();
if(progress>=8){
ending=true;
setTimeout(endGame,1700);
}
}

function parentConfirm(){
completeTask();
}

function stopRecognition(){
speechToken++;
if(recognition){
try{recognition.abort()}catch(e){}
recognition=null;
}
listening=false;
$("micBtn").disabled=false;
}

function recordSpeech(){
if(listening||taskCompleted)return;
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
if(!SR){
$("feedback").textContent=
"Prepoznavanje nije dostupno. Roditelj može potvrditi pokušaj.";
return;
}
speechSynthesis.cancel();
stopRecognition();
const token=++speechToken;
const rec=new SR();
recognition=rec;
rec.lang="hr-HR";
rec.interimResults=false;
rec.maxAlternatives=1;
listening=true;
$("micBtn").disabled=true;
$("feedback").textContent="🎤 Jakove, slušam te!";
rec.onresult=e=>{
if(token!==speechToken)return;
const heard=e.results[0][0].transcript;
$("feedback").textContent="Čuo sam: "+heard;
completeTask();
};
rec.onerror=e=>{
if(token!==speechToken)return;
$("feedback").textContent=
"Nisam dobro čuo. Pokušaj ponovno ili pozovi roditelja.";
};
rec.onend=()=>{
if(token!==speechToken)return;
listening=false;
$("micBtn").disabled=false;
recognition=null;
};
try{rec.start()}
catch(e){
listening=false;
$("micBtn").disabled=false;
$("feedback").textContent="Mikrofon se nije mogao pokrenuti.";
}
}

function nextTask(){
stopRecognition();
if(progress>=8){endGame();return}
if(!taskCompleted){
$("feedback").textContent="Prvo pokušaj riješiti izazov, Jakove!";
return;
}
task++;
showTask();
}

function endGame(){
if($("game").classList.contains("hidden"))return;
clearInterval(ticker);
stopRecognition();
if(!done.includes(day))done.push(day);
localStorage.setItem("jakov_game_done",JSON.stringify(done));
$("game").classList.add("hidden");
$("finish").classList.remove("hidden");
drawDays();
say("Bravo, Jakove! Stigao si do cilja! Pravi si junak!");
}

function finishHome(){
if(day<6)day++;
localStorage.setItem("jakov_game_day",day);
home();
}

home();
</script>
</body>
</html>
